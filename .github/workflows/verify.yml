name: verify
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays: has the authority moved?
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go vet ./...
      # Offline: parses the committed evidence file, so it still passes when
      # USPS is down.
      - run: go test ./...

  authority:
    # Network. Fails when the published list stops matching the authority,
    # which is the entire point of publishing it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      # -refresh so a cached copy can never stand in for the authority in CI.
      - run: go run . verify -refresh

